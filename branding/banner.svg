<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Logo Badge Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Folder Front Gradient -->
    <linearGradient id="frontGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.85" />
    </linearGradient>

    <!-- Accent Next Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4338ca" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Banner Background Card -->
  <rect width="1200" height="400" rx="24" fill="url(#bannerBg)" />
  <rect x="2" y="2" width="1196" height="396" rx="22" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Logo Group Scaled -->
  <g transform="translate(100, 70) scale(0.507)">
    <rect x="36" y="36" width="440" height="440" rx="104" fill="url(#bgGrad)" filter="url(#shadow)" />
    <rect x="38" y="38" width="436" height="436" rx="102" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.3" />

    <path d="M128 172 C128 154 142 140 160 140 L216 140 C228 140 239 146 246 156 L262 178 C267 184 274 188 282 188 L352 188 C370 188 384 202 384 220 L384 324 C384 342 370 356 352 356 L160 356 C142 356 128 342 128 324 Z" 
          fill="#ffffff" fill-opacity="0.25" />

    <path d="M210 240 C195 240 182 252 182 267 C182 269 182 271 183 273 C173 276 166 285 166 296 C166 309 177 320 190 320 L322 320 C336 320 348 309 348 295 C348 282 338 271 325 270 C324 253 310 240 293 240 C287 240 281 242 276 246 C268 235 255 228 240 228 C224 228 211 236 205 248 C202 247 199 246 196 246 Z"
          fill="#ffffff" fill-opacity="0.18" />

    <path d="M168 224 C168 215 175 208 184 208 L206 208 C215 208 222 215 222 224 L222 336 C222 345 215 352 206 352 L184 352 C175 352 168 345 168 336 Z"
          fill="url(#frontGrad)" />

    <path d="M208 212 C214 206 224 206 230 213 L302 298 L302 224 C302 215 309 208 318 208 L340 208 C349 208 356 215 356 224 L356 336 C356 345 349 352 340 352 L318 352 C310 352 302 346 296 338 L222 250 L222 336 C222 345 215 352 206 352"
          fill="url(#frontGrad)" />

    <path d="M308 274 L356 232 C362 227 372 231 372 239 L372 321 C372 329 362 333 356 328 L308 286 C304 283 304 277 308 274 Z"
          fill="url(#arrowGrad)" opacity="0.95" />

    <circle cx="344" cy="280" r="10" fill="#38bdf8" />
  </g>

  <!-- Typography -->
  <text x="420" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">File Browser <tspan fill="#38bdf8">Next</tspan></text>
  <text x="425" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#94a3b8" letter-spacing="0.5">Next-Generation Secure &amp; Modern Web File Manager</text>

  <!-- Subtle Badge Pill -->
  <rect x="425" y="280" width="160" height="32" rx="16" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
  <text x="440" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc">v3.0.0-next</text>

  <rect x="600" y="280" width="170" height="32" rx="16" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
  <text x="615" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#6ee7b7">Security Hardened</text>
</svg>

