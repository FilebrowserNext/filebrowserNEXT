version: '3'

tasks:
  build:frontend:
    desc: Build frontend assets
    dir: frontend
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm run build

  build:backend:
    desc: Build backend binary
    cmds:
      - go build -ldflags='-s -w -X "github.com/filebrowser/filebrowser/v2/version.Version={{.VERSION}}" -X "github.com/filebrowser/filebrowser/v2/version.CommitSHA={{.GIT_COMMIT}}"' -o filebrowser .
    vars:
      GIT_COMMIT:
        sh: git log -n 1 --format=%h
      VERSION:
        sh: git describe --tags --abbrev=0 --match=v* | cut -c 2-

  build:
    desc: Build both frontend and backend
    cmds:
      - task: build:frontend
      - task: build:backend

  package:dist:
    desc: Build and package multi-arch release archives
    cmds:
      - task: build:frontend
      - rm -rf dist-bin dist
      - mkdir -p dist-bin/linux-amd64 dist-bin/linux-arm64 dist-bin/darwin-amd64 dist-bin/darwin-arm64 dist-bin/windows-amd64 dist
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags='-s -w -X "github.com/filebrowser/filebrowser/v2/version.Version={{.VERSION}}" -X "github.com/filebrowser/filebrowser/v2/version.CommitSHA={{.GIT_COMMIT}}"' -o dist-bin/linux-amd64/filebrowser .
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags='-s -w -X "github.com/filebrowser/filebrowser/v2/version.Version={{.VERSION}}" -X "github.com/filebrowser/filebrowser/v2/version.CommitSHA={{.GIT_COMMIT}}"' -o dist-bin/linux-arm64/filebrowser .
      - CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags='-s -w -X "github.com/filebrowser/filebrowser/v2/version.Version={{.VERSION}}" -X "github.com/filebrowser/filebrowser/v2/version.CommitSHA={{.GIT_COMMIT}}"' -o dist-bin/darwin-amd64/filebrowser .
      - CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags='-s -w -X "github.com/filebrowser/filebrowser/v2/version.Version={{.VERSION}}" -X "github.com/filebrowser/filebrowser/v2/version.CommitSHA={{.GIT_COMMIT}}"' -o dist-bin/darwin-arm64/filebrowser .
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags='-s -w -X "github.com/filebrowser/filebrowser/v2/version.Version={{.VERSION}}" -X "github.com/filebrowser/filebrowser/v2/version.CommitSHA={{.GIT_COMMIT}}"' -o dist-bin/windows-amd64/filebrowser.exe .
      - tar -czf dist/filebrowser-linux-amd64.tar.gz -C dist-bin/linux-amd64 filebrowser
      - tar -czf dist/filebrowser-linux-arm64.tar.gz -C dist-bin/linux-arm64 filebrowser
      - tar -czf dist/filebrowser-darwin-amd64.tar.gz -C dist-bin/darwin-amd64 filebrowser
      - tar -czf dist/filebrowser-darwin-arm64.tar.gz -C dist-bin/darwin-arm64 filebrowser
      - cd dist-bin/windows-amd64 && zip ../../dist/filebrowser-windows-amd64.zip filebrowser.exe
      - cd dist && sha256sum filebrowser-linux-amd64.tar.gz filebrowser-linux-arm64.tar.gz filebrowser-darwin-amd64.tar.gz filebrowser-darwin-arm64.tar.gz filebrowser-windows-amd64.zip > checksums.txt
    vars:
      GIT_COMMIT:
        sh: git log -n 1 --format=%h
      VERSION:
        sh: git describe --tags --abbrev=0 --match=v* | cut -c 2-

  release:make:
    internal: true
    prompt: Do you wish to proceed?
    cmds:
      - pnpm dlx commit-and-tag-version -s

  release:dry-run:
    internal: true
    cmds:
      - pnpm dlx commit-and-tag-version --dry-run --skip

  release:
    desc: Create a new release
    cmds:
      - task: docs:cli:generate
      - git add docs/cli
      - |
        if [[ `git status docs/cli --porcelain` ]]; then
          git commit -m 'chore(docs): update CLI documentation'
        fi
      - task: release:dry-run
      - task: release:make

  docs:cli:generate:
    cmds:
      - rm -rf docs/cli
      - mkdir -p docs/cli
      - go run . docs
    generates:
      - docs/cli

